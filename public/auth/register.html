<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Podium</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icon-192x192.png">
    <link rel="icon" type="image/png" href="../icon-192x192.png">
    <meta name="theme-color" content="#1845D4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/theme-init.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        podium: {
                            blue: '#1845D4',
                            deep: '#0D0D1A',
                            muted: '#8888A8',
                            border: '#DDE0F0',
                            bg: '#F5F6FA'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Outfit', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Outfit', serif; }
    </style>
</head>
<body class="bg-[#F5F6FA] dark:bg-slate-950 text-[#0D0D1A] dark:text-slate-100 min-h-screen flex items-center justify-center p-6 transition-colors duration-200 relative bg-cover bg-center" style="background-image: url('https://i.pinimg.com/736x/51/46/2b/51462bff02c31d97324d43de3928996d.jpg');">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px]"></div>

    <div class="relative z-10 w-full max-w-[340px] space-y-5 sm:space-y-6 animate-in fade-in duration-500">
        <!-- Logo/Brand -->
        <div class="text-center space-y-4">
            <a href="/" class="inline-flex items-center justify-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#1845D4] flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
            </a>
            <div class="space-y-1">
                <h2 class="text-2xl font-serif text-white tracking-tighter drop-shadow-md">Create Account</h2>
                <p class="text-white/80 font-medium text-xs drop-shadow-sm">
                    Join Ghana's most powerful classroom
                </p>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white/10 dark:bg-slate-900/20 backdrop-blur-2xl rounded-[24px] border border-white/30 dark:border-white/10 p-6 sm:p-8 shadow-2xl">
            <div class="space-y-5 sm:space-y-6">
                <div id="error-container" class="hidden rounded bg-red-500/20 backdrop-blur-md border border-red-500/30 p-4">
                    <p id="error-message" class="text-[11px] text-red-100 font-bold leading-tight"></p>
                </div>

                <div class="space-y-4">
                    <div class="flex items-start gap-3 sm:gap-4 p-4 rounded-xl bg-white/10 dark:bg-white/5 border border-white/20 shadow-inner">
                        <div class="w-10 h-10 rounded-xl bg-[#1845D4] flex-shrink-0 flex items-center justify-center text-white shadow-md">
                            <i class="fas fa-shield-halved text-sm"></i>
                        </div>
                        <div>
                            <h4 class="text-[13px] font-bold text-white drop-shadow-sm">Verified Access</h4>
                            <p class="text-[10px] text-white/80 mt-1 font-medium leading-relaxed drop-shadow-sm">Secure onboarding via Google. No extra passwords needed.</p>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <button type="button" id="google-btn" class="w-full flex items-center justify-center gap-3 py-3 border border-white/40 hover:border-white rounded-xl text-[10px] font-black text-slate-900 uppercase tracking-widest transition-all active:scale-95 bg-white/95 hover:bg-white shadow-lg">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Continue with Google
                    </button>
                </div>
                <script src="../js/theme-toggle.js"></script>

                <div class="pt-5 sm:pt-6 border-t border-white/20 text-center">
                    <p class="text-[9px] font-bold text-white/60 uppercase tracking-widest drop-shadow-sm">
                        Already have an account? <a href="./login.html" class="text-white hover:text-blue-300 hover:underline transition-all font-black ml-1">Sign In</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="flex justify-center gap-8 pt-4">
            <a href="#" class="text-[9px] font-bold text-white/60 uppercase tracking-widest hover:text-white transition-colors drop-shadow-sm">Terms of Service</a>
            <a href="#" class="text-[9px] font-bold text-white/60 uppercase tracking-widest hover:text-white transition-colors drop-shadow-sm">Privacy Policy</a>
        </div>
    </div>

    <script type="module">
        import { auth, googleProvider } from '../js/firebase-config.js';
        import { signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const googleBtn = document.getElementById('google-btn');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');

        const showError = (msg) => {
            errorMessage.innerText = msg;
            errorContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Google Registration
        googleBtn.onclick = async () => {
            console.log('Google button clicked');
            errorContainer.classList.add('hidden');
            googleBtn.disabled = true;
            try {
                console.log('Starting signInWithPopup...');
                const result = await signInWithPopup(auth, googleProvider);
                console.log('Sign in success:', result.user.email);
                window.location.href = '../dashboard.html';
            } catch (err) {
                console.error('Sign in error:', err);
                alert('Sign in error: ' + err.message);
                showError(err.message);
                googleBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
