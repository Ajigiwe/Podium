<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Podium</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/theme-init.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        podium: {
                            blue: '#1845D4',
                            deep: '#0D0D1A',
                            muted: '#8888A8',
                            border: '#DDE0F0',
                            bg: '#F5F6FA'
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        serif: ['DM Serif Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .font-serif { font-family: 'DM Serif Display', serif; }
    </style>
</head>
<body class="bg-[#F5F6FA] dark:bg-slate-950 text-[#0D0D1A] dark:text-slate-100 min-h-screen flex items-center justify-center p-6 transition-colors duration-200">
    <!-- Theme Toggle -->
    <div class="fixed top-6 right-6">
        <button id="theme-toggle" class="p-3 bg-white dark:bg-slate-900 border border-[#DDE0F0] dark:border-slate-800 rounded-xl shadow-sm hover:border-[#1845D4] transition-all group">
            <i id="theme-icon" class="fas fa-moon text-[#8888A8] group-hover:text-[#1845D4]"></i>
        </button>
    </div>
    <div class="max-w-[380px] w-full space-y-8 animate-in fade-in duration-500">
        <!-- Logo -->
        <div class="text-center space-y-6">
            <a href="/" class="inline-flex items-center justify-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-[#1845D4] flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
            </a>
            <div class="space-y-1">
                <h2 class="text-3xl font-serif text-[#0D0D1A] dark:text-white tracking-tighter">Reset Password</h2>
                <p class="text-[#8888A8] dark:text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                    We'll send you instructions via email
                </p>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-[#DDE0F0] dark:border-slate-800 p-6 sm:p-10 shadow-sm">
            <form id="reset-form" class="space-y-5">
                <div id="error-container" class="hidden rounded bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/40 p-4">
                    <p id="error-message" class="text-[11px] text-red-600 dark:text-red-400 font-bold leading-tight"></p>
                </div>
                <div id="success-container" class="hidden rounded bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-900/40 p-4">
                    <p id="success-message" class="text-[11px] text-green-600 dark:text-green-400 font-bold leading-tight"></p>
                </div>

                <div class="space-y-4">
                    <div class="space-y-1.5">
                        <label for="email" class="block text-[12px] font-bold text-[#0D0D1A] dark:text-white">Email Address</label>
                        <input type="email" id="email" required class="block w-full px-4 py-2.5 bg-white dark:bg-slate-950 border-2 border-[#DDE0F0] dark:border-slate-800 focus:border-[#1845D4] text-[#0D0D1A] dark:text-white rounded-md focus:outline-none transition-all text-[14px] font-medium" placeholder="e.g. kwame@tetteh.com">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full flex justify-center py-3.5 bg-[#1845D4] hover:bg-[#0F2FA8] text-white rounded-md font-bold text-[11px] uppercase tracking-widest transition-all shadow-lg shadow-blue-600/10 active:scale-95">
                    Send Reset Link
                </button>

                <div class="text-center pt-2">
                    <a href="./login.html" class="inline-flex items-center gap-2 text-[10px] font-bold text-[#8888A8] hover:text-[#1845D4] uppercase tracking-widest transition-colors">
                        <i class="fas fa-arrow-left"></i>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/theme-toggle.js"></script>

    <script type="module">
        const resetForm = document.getElementById('reset-form');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const successContainer = document.getElementById('success-container');
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        resetForm.onsubmit = async (e) => {
            e.preventDefault();
            errorContainer.classList.add('hidden');
            successContainer.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>';

            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to send reset link');
                }

                successMessage.innerText = 'Reset link sent! Check your inbox.';
                successContainer.classList.remove('hidden');
                resetForm.reset();
            } catch (err) {
                errorMessage.innerText = err.message;
                errorContainer.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Reset Link';
            }
        };
    </script>
</body>
</html>
